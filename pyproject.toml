[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resolve-project-search"
version = "1.0.0"
description = "Find which DaVinci Resolve project (.drp) contains a given media file."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Resolve Project Search" }]
keywords = ["davinci-resolve", "drp", "video-editing", "search"]

# Offline by design: no HTTP client, no telemetry, no cloud SDK.
dependencies = [
    "PySide6>=6.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
resolve-project-search = "rps.__main__:main"
resolve-doctor = "rps.doctor.cli:main"
rps-probe = "rps.probe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
