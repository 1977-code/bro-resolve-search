name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  windows-exe:
    name: Windows .exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # 3.11 on purpose. Resolve ships fusionscript as a C extension built
      # against one CPython ABI; a 3.12 build could not import it at all on the
      # first real machine we tried ("initialization of fusionscript failed").
      # 3.11 is the newest version with a realistic chance of loading it, and
      # the diagnostic reports plainly if it still cannot.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller

      # Both tools ship together on purpose: the diagnostic is useless without
      # the searcher it feeds, and the searcher is unfinished without the facts
      # the diagnostic collects.
      - name: Build searcher
        run: pyinstaller --noconfirm build/resolve-project-search.spec
      - name: Build doctor
        run: pyinstaller --noconfirm build/resolve-doctor.spec

      - name: Smoke test
        shell: pwsh
        run: |
          # The GUI cannot be launched on a headless runner, but the console
          # paths exercise argument parsing, imports, the frozen bundle and —
          # the one that actually bit us — whether Russian output survives the
          # Windows code page. Checks look for a Traceback rather than for
          # Cyrillic, so the test cannot itself fail on an encoding quirk.
          function Assert-Clean($output, $what) {
            if ($output -match "Traceback|UnicodeEncodeError") {
              throw "$what crashed:`n$output"
            }
          }

          $help = (.\dist\ResolveProjectSearch.exe --help 2>&1 | Out-String)
          Assert-Clean $help "searcher --help"
          if ($help.Trim().Length -eq 0) { throw "searcher --help printed nothing" }

          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          Set-Content -Path smoke\demo.drp -Value '<Project><Clip path="D:\F\C6343.MP4"/></Project>'

          $found = (.\dist\ResolveProjectSearch.exe smoke C6343.MP4 --verbose 2>&1 | Out-String)
          Assert-Clean $found "searcher"
          if ($LASTEXITCODE -ne 0) { throw "searcher did not find the planted clip:`n$found" }
          if ($found -notmatch "demo\.drp") { throw "searcher printed no path:`n$found" }

          $doctor = (.\dist\ResolveDoctor.exe --help 2>&1 | Out-String)
          Assert-Clean $doctor "doctor --help"
          if ($doctor.Trim().Length -eq 0) { throw "doctor --help printed nothing" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/ResolveProjectSearch.exe
            dist/ResolveDoctor.exe
          if-no-files-found: error
          retention-days: 90

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ResolveProjectSearch.exe
            dist/ResolveDoctor.exe
          generate_release_notes: true
